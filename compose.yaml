services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lavanda_flow}
      POSTGRES_USER: ${POSTGRES_USER:-lavanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lavanda}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lavanda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lavanda} -d ${POSTGRES_DB:-lavanda_flow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  lavanda-postgres-data: