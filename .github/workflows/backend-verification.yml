name: Backend Verification

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend-verification.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend-verification.yml"

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
