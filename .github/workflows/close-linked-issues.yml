name: Close Linked Issues

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  pull-requests: read
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([1-9]\d*)\b/gi;
            const issueNumbers = new Set();

            for (const match of body.matchAll(closingPattern)) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info("No closing issue references found in the pull request body.");
              return;
            }

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              });

              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request; skipping.`);
                continue;
              }

              if (issue.state === "closed") {
                core.info(`Issue #${issue_number} is already closed; skipping.`);
                continue;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: "closed",
                state_reason: "completed"
              });

              core.info(`Closed issue #${issue_number} as completed.`);
            }
