name: Supabase Availability

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '29 10 * * *'
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-availability
  cancel-in-progress: false

jobs:
  availability:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check PostgreSQL availability
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER }}
          SUPABASE_DB_CA: ${{ secrets.SUPABASE_DB_CA }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_STATUS_TOKEN: ${{ secrets.SUPABASE_STATUS_TOKEN }}
        run: timeout --signal=TERM 90s python3 scripts/operations/monitor-supabase.py
