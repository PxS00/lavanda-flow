name: Pull Request Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          conventional='^(feat|fix|refactor|test|docs|chore|ci|build|perf|style|revert)\([a-z0-9][a-z0-9-]*\): .+'
          issue_linked='^(feat|fix|refactor|test|docs|chore|ci|build|perf|style|revert)\([a-z0-9][a-z0-9-]*\): .+ \(#[1-9][0-9]*\)$'

          if [[ "$PR_HEAD" == release/* && "$PR_BASE" == "main" ]]; then
            if [[ ! "$PR_TITLE" =~ $conventional ]]; then
              echo "Invalid release pull request title: $PR_TITLE"
              echo "Expected format: <type>(<scope>): <description>"
              echo "Example: chore(release): prepare v0.1.0"
              exit 1
            fi
            exit 0
          fi

          if [[ ! "$PR_TITLE" =~ $issue_linked ]]; then
            echo "Invalid pull request title: $PR_TITLE"
            echo "Expected format: <type>(<scope>): <description> (#<issue-number>)"
            echo "Example: feat(inventory): add stock withdrawal (#27)"
            exit 1
          fi
