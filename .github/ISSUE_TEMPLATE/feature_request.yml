name: Feature request
description: Propose a product feature or improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What real problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the expected solution without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Catalog
        - Inventory
        - Suppliers
        - Frontend / UX
        - Security
        - Infrastructure / observability
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Approved V1 scope
        - Future evolution
        - Requires product / architecture decision
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Add known trade-offs, dependencies, risks, or relevant ADRs when applicable.
