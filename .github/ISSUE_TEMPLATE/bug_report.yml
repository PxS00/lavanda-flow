name: Bug report
description: Report incorrect behavior or a regression.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new issue, check whether the problem is already reported.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the correct behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide minimal and deterministic steps whenever possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend
        - Database
        - Infrastructure / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, payloads, or other useful information without sensitive data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues.
          required: true
        - label: I did not include secrets, passwords, or sensitive data.
          required: true
