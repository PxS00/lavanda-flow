name: Technical task
description: Track architecture, build, testing, infrastructure, or maintenance work.
title: "chore: "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the technical change and expected outcome.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this task is necessary now.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend
        - Database
        - Architecture
        - CI/CD
        - Observability
        - Security
        - Documentation
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add ADRs, documentation, related issues, or relevant decisions.
