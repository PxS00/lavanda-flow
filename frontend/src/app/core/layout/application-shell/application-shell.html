<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    aria-label="Navegação principal"
  >
    <a class="brand-slot" routerLink="/dashboard" aria-label="Lavanda Flow — Painel">
      <img class="brand-logo" src="/lavanda-flow-logo.svg" alt="Lavanda Flow" />
    </a>

    <nav class="primary-navigation" aria-label="Destinos operacionais">
      <section class="nav-group" aria-labelledby="overview-nav-heading">
        <h2 id="overview-nav-heading">Visão geral</h2>
        <mat-nav-list>
          <a
            class="nav-link"
            mat-list-item
            routerLink="/dashboard"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="isHandset() && sidenav.close()"
          >
            Painel
          </a>
        </mat-nav-list>
      </section>

      <section class="nav-group" aria-labelledby="inventory-nav-heading">
        <h2 id="inventory-nav-heading">Estoque</h2>
        <mat-nav-list>
          <a
            class="nav-link"
            mat-list-item
            routerLink="/catalog"
            routerLinkActive="active-link"
            (click)="isHandset() && sidenav.close()"
          >
            Estoque
          </a>
          <a
            class="nav-link"
            mat-list-item
            routerLink="/receipts"
            routerLinkActive="active-link"
            (click)="isHandset() && sidenav.close()"
          >
            Entradas
          </a>
          <a
            class="nav-link"
            mat-list-item
            routerLink="/inventory/alerts"
            routerLinkActive="active-link"
            (click)="isHandset() && sidenav.close()"
          >
            Alertas
          </a>
        </mat-nav-list>
      </section>

      <section class="nav-group" aria-labelledby="production-nav-heading">
        <h2 id="production-nav-heading">Produção</h2>
        <mat-nav-list>
          <a
            class="nav-link"
            mat-list-item
            routerLink="/production/formulas"
            routerLinkActive="active-link"
            (click)="isHandset() && sidenav.close()"
          >
            Produção
          </a>
        </mat-nav-list>
      </section>

      <section class="nav-group" aria-labelledby="registrations-nav-heading">
        <h2 id="registrations-nav-heading">Cadastros</h2>
        <mat-nav-list>
          <a
            class="nav-link"
            mat-list-item
            routerLink="/suppliers"
            routerLinkActive="active-link"
            (click)="isHandset() && sidenav.close()"
          >
            Fornecedores
          </a>
        </mat-nav-list>
      </section>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      @if (isHandset()) {
        <button
          mat-button
          type="button"
          aria-label="Abrir navegação"
          [attr.aria-expanded]="sidenav.opened"
          (click)="sidenav.toggle()"
        >
          Menu
        </button>
        <strong class="mobile-brand">Lavanda Flow</strong>
      }

      @if (username() !== null) {
        <span class="operator-name">{{ username() }}</span>
      }
      <button class="logout-button" mat-button type="button" [disabled]="loggingOut()" (click)="logout()">
        {{ loggingOut() ? 'Saindo...' : 'Sair' }}
      </button>
    </mat-toolbar>

    @if (logoutError() !== null) {
      <div class="shell-error" role="alert">{{ logoutError() }}</div>
    }

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
