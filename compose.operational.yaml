name: lavanda-flow-operational

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  lavanda-flow-app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: operational
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LAVANDA_SESSION_COOKIE_SECURE: ${LAVANDA_SESSION_COOKIE_SECURE:-false}
      EXPIRATION_ALERT_WINDOW_DAYS: ${EXPIRATION_ALERT_WINDOW_DAYS:-30}
      LAVANDA_SECURITY_BOOTSTRAP_ENABLED: ${LAVANDA_SECURITY_BOOTSTRAP_ENABLED:-false}
      LAVANDA_SECURITY_BOOTSTRAP_USERNAME: ${LAVANDA_SECURITY_BOOTSTRAP_USERNAME:-}
      LAVANDA_SECURITY_BOOTSTRAP_PASSWORD: ${LAVANDA_SECURITY_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LAVANDA_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
