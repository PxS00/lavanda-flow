name: lavanda-flow-operational

services:
  lavanda-flow-app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: operational
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:?SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE is required}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-0}
      LAVANDA_SESSION_COOKIE_SECURE: ${LAVANDA_SESSION_COOKIE_SECURE:-false}
      EXPIRATION_ALERT_WINDOW_DAYS: ${EXPIRATION_ALERT_WINDOW_DAYS:-30}
      LAVANDA_SECURITY_BOOTSTRAP_ENABLED: ${LAVANDA_SECURITY_BOOTSTRAP_ENABLED:-false}
      LAVANDA_SECURITY_BOOTSTRAP_USERNAME: ${LAVANDA_SECURITY_BOOTSTRAP_USERNAME:-}
      LAVANDA_SECURITY_BOOTSTRAP_PASSWORD: ${LAVANDA_SECURITY_BOOTSTRAP_PASSWORD:-}
    volumes:
      - type: bind
        source: ${LAVANDA_DB_CA_CERTIFICATE_PATH:?LAVANDA_DB_CA_CERTIFICATE_PATH is required}
        target: /run/secrets/lavanda-postgres-ca.crt
        read_only: true
    ports:
      - "${LAVANDA_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
